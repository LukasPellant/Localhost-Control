name: Native Host Artifacts

on:
  push:
    branches:
      - main
      - "codex/**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows native host
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test:run

      - name: Run Rust native host tests
        run: cargo test -p localhost-control-host

      - name: Typecheck
        run: pnpm typecheck

      - name: Build workspace
        run: pnpm build

      - name: Package Chrome extension
        run: pnpm extension:package:chrome

      - name: Package Firefox extension
        run: pnpm extension:package:firefox

      - name: Verify extension packages
        run: pnpm extension:verify

      - name: Lint Firefox extension package
        run: pnpm extension:lint:firefox

      - name: Upload extension store packages
        uses: actions/upload-artifact@v4
        with:
          name: localhost-control-extension-store-packages
          path: |
            dist/chrome-store/*.zip
            dist/firefox-addons/*.zip
          if-no-files-found: error

      - name: Package Windows native host
        run: pnpm host:package:windows

      - name: Validate Windows zip
        run: pnpm host:verify:windows

      - name: Set up Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2

      - name: Smoke Chrome native messaging
        run: pnpm smoke:browser-native -- --browser chrome --browser-exe "${{ steps.setup-chrome.outputs.chrome-path }}" --headless --required --host-path target/release/localhost-control-host.exe

      - name: Set up Firefox
        id: setup-firefox
        uses: browser-actions/setup-firefox@v1

      - name: Smoke Firefox native messaging
        run: pnpm smoke:browser-native -- --browser firefox --browser-exe "${{ steps.setup-firefox.outputs.firefox-path }}" --headless --required --host-path target/release/localhost-control-host.exe

      - name: Write Windows checksums
        run: node scripts/write-native-host-checksums.mjs

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: localhost-control-native-host-windows
          path: dist/native-host/*
          if-no-files-found: error

  linux:
    name: Linux native host (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test:run

      - name: Run Rust native host tests
        run: cargo test -p localhost-control-host

      - name: Native host smoke diagnostics
        continue-on-error: true
        shell: bash
        run: |
          echo "::group::Native host smoke diagnostics"
          node -v
          pnpm -v
          uname -a || true
          ps -p $$ -o pid= -o ppid= -o comm= -o etime= -o pcpu= -o rss= -o command= || true
          ps -p $$ -o pid= -o ppid= -o comm= -o etime= -o %cpu= -o rss= -o command= || true
          ps L 2>/dev/null || ps -L 2>/dev/null || true
          echo "::endgroup::"
          cargo test -p localhost-control-host

      - name: Typecheck
        run: pnpm typecheck

      - name: Build workspace
        run: pnpm build

      - name: Package Linux native host
        run: |
          node scripts/package-native-host.mjs --platform=linux --format=tarball --arch=${{ matrix.arch }}
          node scripts/package-native-host.mjs --platform=linux --format=deb --arch=${{ matrix.arch }}

      - name: Validate Linux tarball
        run: node scripts/validate-native-host-package.mjs --platform=linux --format=tarball --arch=${{ matrix.arch }}

      - name: Validate Linux deb
        run: node scripts/validate-native-host-package.mjs --platform=linux --format=deb --arch=${{ matrix.arch }}

      - name: Set up Chrome
        if: matrix.arch == 'amd64'
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2

      - name: Set up Firefox
        id: setup-firefox
        uses: browser-actions/setup-firefox@v1

      - name: Smoke installed Linux deb
        env:
          BROWSER_NATIVE_SMOKE_BROWSERS: ${{ matrix.arch == 'amd64' && 'chrome firefox' || 'firefox' }}
          BROWSER_NATIVE_SMOKE_REQUIRED: "true"
          CHROME_BROWSER_EXE: ${{ steps.setup-chrome.outputs.chrome-path }}
          FIREFOX_BROWSER_EXE: ${{ steps.setup-firefox.outputs.firefox-path }}
        run: bash scripts/ci/smoke-installed-linux-deb.sh ${{ matrix.arch }}

      - name: Write Linux checksums
        run: node scripts/write-native-host-checksums.mjs

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: localhost-control-native-host-linux-${{ matrix.arch }}
          path: dist/native-host/*
          if-no-files-found: error

  macos:
    name: macOS native host
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test:run

      - name: Run Rust native host tests
        run: cargo test -p localhost-control-host

      - name: Install macOS Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Native host smoke diagnostics
        continue-on-error: true
        shell: bash
        run: |
          echo "::group::Native host smoke diagnostics"
          node -v
          pnpm -v
          uname -a || true
          ps -p $$ -o pid= -o ppid= -o comm= -o etime= -o pcpu= -o rss= -o command= || true
          ps -p $$ -o pid= -o ppid= -o comm= -o etime= -o %cpu= -o rss= -o command= || true
          ps L 2>/dev/null || ps -L 2>/dev/null || true
          echo "::endgroup::"
          cargo test -p localhost-control-host

      - name: Typecheck
        run: pnpm typecheck

      - name: Build workspace
        run: pnpm build

      - name: Package macOS native host
        run: pnpm host:package:mac

      - name: Validate macOS tarball
        run: node scripts/validate-native-host-package.mjs --platform=darwin --format=tarball

      - name: Validate macOS pkg
        run: node scripts/validate-native-host-package.mjs --platform=darwin --format=pkg

      - name: Set up Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2

      - name: Set up Firefox
        id: setup-firefox
        uses: browser-actions/setup-firefox@v1

      - name: Smoke installed macOS pkg
        env:
          BROWSER_NATIVE_SMOKE_REQUIRED: "true"
          CHROME_BROWSER_EXE: ${{ steps.setup-chrome.outputs.chrome-path }}
          FIREFOX_BROWSER_EXE: ${{ steps.setup-firefox.outputs.firefox-path }}
        run: bash scripts/ci/smoke-installed-macos-pkg.sh

      - name: Write macOS checksums
        run: node scripts/write-native-host-checksums.mjs

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: localhost-control-native-host-macos
          path: dist/native-host/*
          if-no-files-found: error

  macos-intel:
    name: macOS Intel compatibility
    runs-on: macos-15-intel
    needs: macos
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: localhost-control-native-host-macos
          path: dist/native-host

      - name: Validate downloaded macOS tarball on Intel
        run: node scripts/validate-native-host-package.mjs --platform=darwin --format=tarball

      - name: Validate downloaded macOS pkg on Intel
        run: node scripts/validate-native-host-package.mjs --platform=darwin --format=pkg

      - name: Set up Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2

      - name: Set up Firefox
        id: setup-firefox
        uses: browser-actions/setup-firefox@v1

      - name: Smoke downloaded macOS pkg on Intel
        env:
          BROWSER_NATIVE_SMOKE_REQUIRED: "true"
          CHROME_BROWSER_EXE: ${{ steps.setup-chrome.outputs.chrome-path }}
          FIREFOX_BROWSER_EXE: ${{ steps.setup-firefox.outputs.firefox-path }}
        run: bash scripts/ci/smoke-installed-macos-pkg.sh
