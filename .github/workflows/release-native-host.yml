name: Release Native Host

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v0.1.2"
        required: true
        type: string

permissions:
  contents: read

jobs:
  windows:
    name: Windows release assets
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test:run

      - name: Run Rust native host tests
        run: cargo test -p localhost-control-host

      - name: Typecheck
        run: pnpm typecheck

      - name: Build workspace
        run: pnpm build

      - name: Package Windows native host
        run: pnpm host:package:windows

      - name: Validate Windows asset
        run: pnpm host:verify:windows

      - name: Upload Windows release asset
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/native-host/localhost-control-native-host-windows-*.zip
          if-no-files-found: error

  linux:
    name: Linux release assets (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test:run

      - name: Run Rust native host tests
        run: cargo test -p localhost-control-host

      - name: Typecheck
        run: pnpm typecheck

      - name: Build workspace
        run: pnpm build

      - name: Package Linux native host
        run: |
          node scripts/package-native-host.mjs --platform=linux --format=tarball --arch=${{ matrix.arch }}
          node scripts/package-native-host.mjs --platform=linux --format=deb --arch=${{ matrix.arch }}

      - name: Validate Linux assets
        run: |
          node scripts/validate-native-host-package.mjs --platform=linux --format=tarball --arch=${{ matrix.arch }}
          node scripts/validate-native-host-package.mjs --platform=linux --format=deb --arch=${{ matrix.arch }}

      - name: Smoke installed Linux deb
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            sudo dpkg -r localhost-control-native-host >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          sudo dpkg -i dist/native-host/localhost-control-native-host_*_${{ matrix.arch }}.deb
          test -x /usr/lib/localhost-control/localhost-control-host
          test -f /etc/opt/chrome/native-messaging-hosts/com.localhost_control.host.json
          test -f /etc/brave/native-messaging-hosts/com.localhost_control.host.json
          test -f /usr/lib/mozilla/native-messaging-hosts/com.localhost_control.host.json
          node <<'NODE'
          const { spawnSync } = require("node:child_process");
          const pkg = require("./package.json");
          const body = Buffer.from(JSON.stringify({ id: "installed-smoke", method: "version" }));
          const frame = Buffer.alloc(4 + body.length);
          frame.writeUInt32LE(body.length, 0);
          body.copy(frame, 4);
          const result = spawnSync("/usr/lib/localhost-control/localhost-control-host", [], { input: frame, timeout: 5000 });
          if (result.status !== 0) throw new Error(result.stderr?.toString() || `host exited with ${result.status}`);
          const length = result.stdout.readUInt32LE(0);
          const response = JSON.parse(result.stdout.subarray(4, 4 + length).toString("utf8"));
          if (response.id !== "installed-smoke" || response.result?.version !== pkg.version) throw new Error("invalid native host version response");
          NODE
          sudo dpkg -r localhost-control-native-host
          trap - EXIT
          test ! -e /usr/lib/localhost-control/localhost-control-host
          test ! -e /etc/opt/chrome/native-messaging-hosts/com.localhost_control.host.json
          test ! -e /etc/brave/native-messaging-hosts/com.localhost_control.host.json
          test ! -e /usr/lib/mozilla/native-messaging-hosts/com.localhost_control.host.json

      - name: Upload Linux release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.arch }}
          path: |
            dist/native-host/localhost-control-native-host-linux-${{ matrix.arch }}-*.tar.gz
            dist/native-host/localhost-control-native-host_*_${{ matrix.arch }}.deb
          if-no-files-found: error

  macos:
    name: macOS release assets
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test:run

      - name: Run Rust native host tests
        run: cargo test -p localhost-control-host

      - name: Install macOS Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Typecheck
        run: pnpm typecheck

      - name: Build workspace
        run: pnpm build

      - name: Package macOS native host
        run: pnpm host:package:mac

      - name: Validate macOS assets
        run: pnpm host:verify:mac

      - name: Smoke installed macOS pkg
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            if [ -x "/Library/Application Support/Localhost Control/uninstall.sh" ]; then
              sudo "/Library/Application Support/Localhost Control/uninstall.sh" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT
          sudo installer -pkg dist/native-host/localhost-control-native-host-macos-universal-*.pkg -target /
          test -x "/Library/Application Support/Localhost Control/localhost-control-host"
          test -f "/Library/Google/Chrome/NativeMessagingHosts/com.localhost_control.host.json"
          test -f "/Library/Application Support/BraveSoftware/Brave-Browser/NativeMessagingHosts/com.localhost_control.host.json"
          test -f "/Library/Application Support/Mozilla/NativeMessagingHosts/com.localhost_control.host.json"
          node <<'NODE'
          const { spawnSync } = require("node:child_process");
          const pkg = require("./package.json");
          const hostPath = "/Library/Application Support/Localhost Control/localhost-control-host";
          const body = Buffer.from(JSON.stringify({ id: "installed-smoke", method: "version" }));
          const frame = Buffer.alloc(4 + body.length);
          frame.writeUInt32LE(body.length, 0);
          body.copy(frame, 4);
          const result = spawnSync(hostPath, [], { input: frame, timeout: 5000 });
          if (result.status !== 0) throw new Error(result.stderr?.toString() || `host exited with ${result.status}`);
          const length = result.stdout.readUInt32LE(0);
          const response = JSON.parse(result.stdout.subarray(4, 4 + length).toString("utf8"));
          if (response.id !== "installed-smoke" || response.result?.version !== pkg.version) throw new Error("invalid native host version response");
          NODE
          sudo "/Library/Application Support/Localhost Control/uninstall.sh"
          trap - EXIT
          test ! -e "/Library/Application Support/Localhost Control/localhost-control-host"
          test ! -e "/Library/Google/Chrome/NativeMessagingHosts/com.localhost_control.host.json"
          test ! -e "/Library/Application Support/BraveSoftware/Brave-Browser/NativeMessagingHosts/com.localhost_control.host.json"
          test ! -e "/Library/Application Support/Mozilla/NativeMessagingHosts/com.localhost_control.host.json"

      - name: Upload macOS release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: |
            dist/native-host/localhost-control-native-host-macos-universal-*.tar.gz
            dist/native-host/localhost-control-native-host-macos-universal-*.pkg
          if-no-files-found: error

  macos-intel:
    name: macOS Intel compatibility
    runs-on: macos-15-intel
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Rust native host tests
        run: cargo test -p localhost-control-host

      - name: Install macOS Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Package macOS tarball on Intel
        run: pnpm host:package:mac:tarball

      - name: Validate macOS tarball on Intel
        run: pnpm host:verify:mac:tarball

      - name: Package macOS pkg on Intel
        run: node scripts/package-native-host.mjs --platform=darwin --format=pkg

      - name: Validate macOS pkg on Intel
        run: node scripts/validate-native-host-package.mjs --platform=darwin --format=pkg

      - name: Smoke installed macOS pkg on Intel
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            if [ -x "/Library/Application Support/Localhost Control/uninstall.sh" ]; then
              sudo "/Library/Application Support/Localhost Control/uninstall.sh" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT
          sudo installer -pkg dist/native-host/localhost-control-native-host-macos-universal-*.pkg -target /
          test -x "/Library/Application Support/Localhost Control/localhost-control-host"
          node <<'NODE'
          const { spawnSync } = require("node:child_process");
          const pkg = require("./package.json");
          const hostPath = "/Library/Application Support/Localhost Control/localhost-control-host";
          const body = Buffer.from(JSON.stringify({ id: "installed-smoke", method: "version" }));
          const frame = Buffer.alloc(4 + body.length);
          frame.writeUInt32LE(body.length, 0);
          body.copy(frame, 4);
          const result = spawnSync(hostPath, [], { input: frame, timeout: 5000 });
          if (result.status !== 0) throw new Error(result.stderr?.toString() || `host exited with ${result.status}`);
          const length = result.stdout.readUInt32LE(0);
          const response = JSON.parse(result.stdout.subarray(4, 4 + length).toString("utf8"));
          if (response.id !== "installed-smoke" || response.result?.version !== pkg.version) throw new Error("invalid native host version response");
          NODE
          sudo "/Library/Application Support/Localhost Control/uninstall.sh"
          trap - EXIT
          test ! -e "/Library/Application Support/Localhost Control/localhost-control-host"

  extension:
    name: Extension store packages
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package Chrome extension
        run: pnpm extension:package:chrome

      - name: Package Firefox extension
        run: pnpm extension:package:firefox

      - name: Verify extension packages
        run: pnpm extension:verify

      - name: Lint Firefox extension package
        run: pnpm extension:lint:firefox

      - name: Upload extension release assets
        uses: actions/upload-artifact@v4
        with:
          name: extension-store-packages
          path: |
            dist/chrome-store/*.zip
            dist/firefox-addons/*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - windows
      - linux
      - macos
      - macos-intel
      - extension
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist/native-host
          merge-multiple: true

      - name: Write checksums
        run: node scripts/write-native-host-checksums.mjs

      - name: Download extension release assets
        uses: actions/download-artifact@v4
        with:
          name: extension-store-packages
          path: dist/extension-store

      - name: Resolve release notes
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [ -f "docs/releases/${RELEASE_TAG}.md" ]; then
            cp "docs/releases/${RELEASE_TAG}.md" dist/release-notes.md
          else
            {
              echo "# Localhost Control ${RELEASE_TAG}"
              echo
              echo "Install the browser extension from the Chrome Web Store, then download the native host package for your operating system from this release."
            } > dist/release-notes.md
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Localhost Control ${{ inputs.tag || github.ref_name }}
          body_path: dist/release-notes.md
          files: |
            dist/native-host/*
            dist/extension-store/**/*.zip
          fail_on_unmatched_files: true
